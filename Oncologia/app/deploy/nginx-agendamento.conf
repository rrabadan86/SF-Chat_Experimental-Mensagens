# nginx — porta de entrada do agendamento.
#
# Coloque em /etc/nginx/sites-available/agendamento e crie o link em
# sites-enabled. Troque agendamento.seudominio.com.br pelo domínio real.
#
# O bloco HTTPS abaixo é escrito pelo certbot; rode-o depois de subir este
# arquivo com o bloco :80 funcionando.

# freio no login do painel: 5 tentativas por minuto por IP, com folga de 5.
# Segunda camada — o próprio sistema já bloqueia 8 erros em 15 min.
limit_req_zone $binary_remote_addr zone=painel_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agendamento.seudominio.com.br;

    # o certbot preenche isto; até lá, o site responde em http mesmo
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agendamento.seudominio.com.br;

    # ssl_certificate ... ;   <- preenchido pelo certbot
    # ssl_certificate_key ... ;

    # dado de saúde: nada de cache em intermediário e nada de referer vazando
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # o painel do médico não deve ser indexado
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin\n";
    }

    location = /admin/api/entrar {
        limit_req zone=painel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
