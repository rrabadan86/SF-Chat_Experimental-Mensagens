# nginx — porta de entrada do agendamento.
#
#   sudo cp deploy/nginx-agendamento.conf /etc/nginx/sites-available/agendamento
#   sudo sed -i 's/SEU_DOMINIO/agendamento.seudominio.com.br/g' /etc/nginx/sites-available/agendamento
#   sudo ln -sf /etc/nginx/sites-available/agendamento /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d agendamento.seudominio.com.br
#
# Este arquivo tem SÓ o bloco :80, de propósito. O nginx recusa iniciar com
# "listen 443 ssl" enquanto não existir certificado, e o certificado só é criado
# pelo certbot — que precisa do :80 no ar para provar o domínio. O certbot copia
# este bloco para um :443 com o certificado e acrescenta o redirecionamento.

limit_req_zone $binary_remote_addr zone=painel_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # dado de saúde: nada de referer vazando, nada de sniffing
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    # o painel do médico não deve ser indexado
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin\n";
    }

    # freio no login do painel: 5 por minuto por IP, com folga de 5.
    # Segunda camada — o sistema já bloqueia 8 erros em 15 minutos.
    location = /admin/api/entrar {
        limit_req zone=painel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Depois do certbot, o bloco :443 aparece aqui, escrito por ele, e o :80 acima
# ganha o redirecionamento. Vale acrescentar no bloco :443, à mão:
#     add_header Strict-Transport-Security "max-age=31536000" always;
